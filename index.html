<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Assets Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Top Navbar -->
<header class="navbar">
  <div class="nav-left">
    <span class="home">Home / Assets</span>
  </div>

  <div class="nav-center">
    <input type="text" id="searchInput" placeholder="Search" />
  </div>

  <div class="nav-right">
    <div class="logo-wrapper">
      <img src="logo\HQ.png" class="nav-logo">
      <span class="arrow" onclick="toggleLogoMenu()">▼</span>

      <div class="dropdown" id="logoMenu">
        <div>Profile</div>
        <div>Settings</div>
        <div>Logout</div>
      </div>
    </div>
  </div>
</header>

  <!-- CONTENT -->
  <main class="container">

    <!-- CARDS -->
    <div class="cards">

      <!-- ROW 1 -->
      <div class="row">

        <div class="card dark">
          <img src="logo\computer_23986.png">
          <span class="title">Computers</span>
          <span class="value">0</span>
        </div>

        <div class="card" style="background-color: #1E3A8A;">
          <img src="logo\software_256_icon-icons.com_76005.png">
          <span class="title">Softwares</span>
          <span class="value">5</span>
        </div>

        <div class="card" style="background-color: #1D4ED8;">
         <img src="logo\network_2045.png">
          <span class="title">Network Devices</span>
          <span class="value">77</span>
        </div>

        <div class="card" style="background-color: #2563EB;" >
           <img src="logo\iconfinder-serverrack-4417101_116637.png">
          <span class="title">Racks</span>
          <span class="value">19</span>
        </div>

        <div class="card" style="background-color: #3B82F6;">
          <img src="logo\phone_4307.png">
          <span class="title">Phones</span>
          <span class="value">8</span>
        </div>

        <div class="card light" style="background-color: #60A5FA;">
           <img src="logo\print-black-printer-tool-symbol_icon-icons.com_54467.png">
          <span class="title">Printers</span>
          <span class="value">43</span>
        </div>
      </div>

      <!-- ROW 2 -->
      <div class="row">
        <div class="card light" style="background-color: #1D262F;">
           <img src="logo\monitor_icon-icons.com_64979.png">
          <span class="title">Monitors</span>
          <span class="value">43</span>
        </div>

        <div class="card dark2" style="background-color: #3A4F8C;">
          <img src="logo\3643767-key-keys-main-password-privilege_113429.png">
          <span class="title">Licenses</span>
          <span class="value">11</span>
        </div>

        <div class="card" style="background-color: #637FCF;">
           <img src="logo\audio_cable_headphone_jack_lead_stereo_icon_123314.png">
          <span class="title">PDUs</span>
          <span class="value">9</span>
        </div>

        <div class="card" style="background-color: #678FE7;">
           <img src="logo\clip.png">
          <span class="title">Enclosures</span>
          <span class="value">39</span>
        </div>

        <div class="card disabled" style="background-color: #76A7F6;">
          <img src="logo\computer_23986.png">
          <span class="title">Computer By Type</span>
          <span class="note">Not found data</span>
        </div>

        <div class="card disabled" style="background-color: #76A7F6;">
          <img src="logo\computer_23986.png">
          <span class="title">Softwares By Statues </span>
          <span class="note">Not found data</span>
        </div>
      </div>

    </div>
  </main>
<script src="script.js"></script>
</body>
</html>
