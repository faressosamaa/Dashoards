    <!-- ===== MAIN ===== -->
    <main class="main">

      <!-- TOP BAR -->
      <header class="topbar">
        <button class="burger" type="button" aria-label="Toggle menu" id="burgerBtn">
          <img class="burger-ico-img" src="logo\Sidebar-logo\menu.png" alt="Menu" />
        </button>

        <a class="top-left" href="Home-page.html" data-go="Home-page.html">Home</a>

        <div class="top-search">
          <input type="search" placeholder="Search" aria-label="Search" />
          <img class="icon-img icon-search" src="logo\Sidebar-logo\search_icon_149872.png" alt="Search" />
        </div>

        <div class="top-right">
          <details class="user-dd">
            <summary class="user-summary" aria-label="User menu">
              <img class="user-logo" src="logo\HQ.png" />
              <img class="user-dd-ico-img" src="logo\Sidebar-logo\arrow-right.png" alt="Open menu" />
            </summary>
            <div class="user-menu">
              <a href="#">Profile</a>
              <a href="#">Settings</a>
              <a href="#">Logout</a>
            </div>
          </details>
        </div>
      </header>
      <div class="layout">
  <div class="form-shell ticket-shell">

    <div class="ticket-split">

      <!-- LEFT -->
      <section class="panel panel-left">
        <div class="panel-head">Ticket</div>

        <form class="ticket-form">
          <div class="field">
            <label>Title</label>
            <input type="text" placeholder="Name">
          </div>

          <div class="field">
            <label>Description *</label>
            <textarea class="desc"></textarea>
          </div>

          <div class="upload-box">
            <div class="upload-inner">
              <div class="upload-icon">📎</div>
              <div>
                <div class="upload-title">Drag&Drop files here</div>
                <div class="upload-sub">Or</div>
              </div>
              <button type="button" class="upload-btn">Browse files</button>
            </div>
            <div class="upload-foot">File(s) (2 MB max)</div>
          </div>
        </form>
      </section>

      <!-- RIGHT -->
      <aside class="panel panel-right">
        <div class="right-scroll">
            <div class="mini-card form-glass">
  <div class="mini-title">Tickets</div>

  <div class="tickets-grid">

    <!-- Opening Date -->
    <div class="field">
      <label>Opening Date</label>
      <input type="date" name="openingDate">
    </div>

    <!-- Type (custom dropdown) -->
    <div class="field">
      <label>Type</label>

      <div class="dd" data-name="type">
        <button type="button" class="dd-btn">
          <span class="dd-value is-placeholder" data-placeholder="Choose Type">Choose Type</span>
          <img class="dd-arrow" src="logo/Sidebar-logo/down-chevron.png" alt="">
        </button>

        <div class="dd-menu">
          <button type="button" class="dd-item" data-value="Computer">Computer</button>
          <button type="button" class="dd-item" data-value="Monitor">Monitor</button>
          <button type="button" class="dd-item" data-value="PDUs">PDUs</button>
          <button type="button" class="dd-item" data-value="Network Device">Network Device</button>
          <button type="button" class="dd-item" data-value="Printer">Printer</button>
          <button type="button" class="dd-item" data-value="Phone">Phone</button>
        </div>

        <input type="hidden" name="type" class="dd-hidden">
      </div>
    </div>

    <!-- Priority -->
    <div class="field">
      <label>Priority</label>

      <div class="dd" data-name="priority">
        <button type="button" class="dd-btn">
          <span class="dd-value is-placeholder" data-placeholder="Choose Priority">Choose Priority</span>
          <img class="dd-arrow" src="logo/Sidebar-logo/down-chevron.png" alt="">
        </button>

        <div class="dd-menu">
          <button type="button" class="dd-item" data-value="High">High</button>
          <button type="button" class="dd-item" data-value="Medium">Medium</button>
          <button type="button" class="dd-item" data-value="Low">Low</button>
        </div>

        <input type="hidden" name="priority" class="dd-hidden">
      </div>
    </div>

    <!-- Status -->
    <div class="field">
      <label>Status</label>

      <div class="dd" data-name="status">
        <button type="button" class="dd-btn">
          <span class="dd-value is-placeholder" data-placeholder="Choose Status">Choose Status</span>
          <img class="dd-arrow" src="logo/Sidebar-logo/down-chevron.png" alt="">
        </button>

        <div class="dd-menu">
          <button type="button" class="dd-item" data-value="Opened">Opened</button>
          <button type="button" class="dd-item" data-value="Assigned">Assigned</button>
          <button type="button" class="dd-item" data-value="Solved">Solved</button>
          <button type="button" class="dd-item" data-value="Closed">Closed</button>
        </div>

        <input type="hidden" name="status" class="dd-hidden">
      </div>
    </div>

  </div>
            </div>

          <div class="mini-card">
            <div class="mini-title">Actors</div>

            <div class="field">
              <label>Requester</label>
              <input type="text">
            </div>

            <div class="field">
              <label>Observer</label>
              <input type="text">
            </div>

            <div class="field">
              <label>Assigned to</label>
              <input type="text">
            </div>
          </div>

          <div class="mini-card">
            <div class="mini-title">Items</div>

            <div class="toggle-row">
              <button type="button" class="pill active">My Devices</button>
              <span class="or">OR</span>
              <button type="button" class="pill">General</button>
            </div>

            <div class="field">
              <label>Item</label>
              <input type="text" placeholder="Database">
            </div>

           <button class="btn-add" id="goBtn2" type="button" onclick="window.location.href='LOFTCK.HTML'">
  Add
</button>
